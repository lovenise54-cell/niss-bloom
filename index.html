<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Niss Bloom | Custom Handmade Bouquets</title>

  <meta
    name="description"
    content="Niss Bloom — custom handmade bouquets made with love in Indianapolis."
  >

  <!-- Cute, classy fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Great+Vibes&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

<style>

  /* =========================
     GLOBAL
  ========================= */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  :root {
    --black: #080808;
    --black-soft: #101010;
    --card: #151515;

    --dark-red: #4b0000;
    --burgundy: #650914;
    --red: #8f1024;
    --bright-red: #b51e37;

    --cream: #f6eeee;
    --white: #ffffff;
    --gray: #b8a8aa;

    --border: #43151c;
  }

  body {
    font-family: "Poppins", Arial, sans-serif;
    background: var(--black);
    color: var(--cream);
    line-height: 1.6;
  }

  /* =========================
     FIRST ORDER BANNER
  ========================= */

  .first-order-special {
    background: var(--dark-red);
    color: white;
    text-align: center;
    padding: 11px 15px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .4px;
    border-bottom: 1px solid var(--red);
  }

  .first-order-special span {
    display: block;
    font-size: 12px;
    margin-top: 2px;
    color: #e8d5d8;
    font-weight: 400;
  }

  /* =========================
     NAVIGATION
  ========================= */

  nav {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(8, 8, 8, .97);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid var(--border);

    padding: 15px 5%;

    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: "Great Vibes", cursive;
    font-size: 34px;
    color: var(--bright-red);
    line-height: 1;
    text-shadow: 0 0 15px rgba(181, 30, 55, .25);
  }

  .nav-links {
    display: flex;
    gap: 25px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: #eee;
    font-size: 13px;
    font-weight: 600;
    transition: .25s;
  }

  .nav-links a:hover {
    color: var(--bright-red);
  }

  /* =========================
     HERO
  ========================= */

  .hero {
    min-height: 90vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 80px 20px;

    background:
      linear-gradient(
        rgba(0, 0, 0, .70),
        rgba(35, 0, 5, .88)
      ),
      url("pink-bouquet.jpg") center/cover;
  }

  .hero-content {
    max-width: 850px;
    animation: fadeUp 1s ease;
  }

  .hero h1 {
    font-family: "Great Vibes", cursive;
    font-size: clamp(70px, 13vw, 125px);
    color: var(--bright-red);
    line-height: .95;
    margin-bottom: 20px;

    text-shadow:
      0 0 12px rgba(181, 30, 55, .45),
      0 0 35px rgba(181, 30, 55, .20);
  }

  .hero p {
    font-size: 18px;
    color: #f2e8e9;
    margin-bottom: 32px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .btn {
    display: inline-block;

    padding: 13px 25px;

    border-radius: 30px;

    border: none;

    cursor: pointer;

    text-decoration: none;

    font-family: "Poppins", sans-serif;

    font-size: 14px;
    font-weight: 700;

    transition: .25s;
  }

  .btn-primary {
    background: var(--red);
    color: white;

    border: 1px solid var(--bright-red);

    box-shadow:
      0 5px 18px rgba(100, 0, 15, .30);
  }

  .btn-primary:hover {
    background: var(--bright-red);
    transform: translateY(-3px);

    box-shadow:
      0 8px 25px rgba(181, 30, 55, .30);
  }

  .btn-light {
    background: transparent;
    color: #e5cdd1;

    border: 1px solid var(--red);
  }

  .btn-light:hover {
    background: var(--dark-red);
    color: white;
    transform: translateY(-2px);
  }

  /* =========================
     GENERAL SECTIONS
  ========================= */

  section {
    padding: 80px 6%;
  }

  .section-title {
    text-align: center;
    margin-bottom: 45px;
  }

  .section-title h2 {
    font-family: "Great Vibes", cursive;
    font-size: 50px;
    font-weight: 400;

    color: var(--bright-red);

    text-shadow:
      0 0 15px rgba(181, 30, 55, .18);
  }

  .section-title p {
    margin-top: 5px;
    color: var(--gray);
    font-size: 14px;
  }

  /* =========================
     ABOUT
  ========================= */

  .about {
    max-width: 850px;
    margin: auto;

    text-align: center;

    font-size: 17px;
    color: #d8c9cb;
  }

  /* =========================
     GALLERY
  ========================= */

  .gallery {
    display: grid;

    grid-template-columns:
      repeat(auto-fit, minmax(230px, 1fr));

    gap: 24px;

    max-width: 1100px;

    margin: auto;
  }

  .gallery-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
      0 10px 30px rgba(0, 0, 0, .45);

    transition: .3s;
  }

  .gallery-card:hover {
    transform: translateY(-6px);

    border-color: var(--red);

    box-shadow:
      0 15px 35px rgba(90, 0, 15, .30);
  }

  .gallery-card img {
    width: 100%;
    height: 360px;

    object-fit: cover;

    display: block;
  }

  .gallery-card h3 {
    padding: 17px;

    text-align: center;

    color: #e2c6ca;

    font-family: "DM Serif Display", serif;

    font-size: 19px;
    font-weight: 400;
  }

  /* =========================
     PRICES
  ========================= */

  .price-grid {
    display: grid;

    grid-template-columns:
      repeat(auto-fit, minmax(170px, 1fr));

    gap: 18px;

    max-width: 1000px;

    margin: auto;
  }

  .price-card {
    background: var(--card);

    padding: 27px 15px;

    text-align: center;

    border: 1px solid var(--border);

    border-radius: 18px;

    transition: .25s;
  }

  .price-card:hover {
    transform: translateY(-5px);

    border-color: var(--red);

    background: #181010;
  }

  .price-card h3 {
    font-family: "DM Serif Display", serif;

    color: #d6aeb4;

    font-size: 21px;

    font-weight: 400;
  }

  .price {
    color: var(--bright-red);

    font-size: 29px;

    font-weight: 800;

    margin: 7px 0;
  }

  .rose-count {
    color: var(--gray);
    font-size: 13px;
  }

  /* =========================
     CUSTOMIZATION
  ========================= */

  .extras-box {
    max-width: 800px;

    margin: auto;

    background: var(--card);

    padding: 30px;

    border-radius: 20px;

    border: 1px solid var(--border);

    box-shadow:
      0 10px 30px rgba(0, 0, 0, .35);
  }

  .extras-box ul {
    list-style: none;
  }

  .extras-box li {
    padding: 11px 0;

    border-bottom:
      1px solid #291215;

    color: #ddd0d2;

    font-size: 14px;
  }

  .extras-box li:last-child {
    border-bottom: none;
  }

  /* =========================
     ORDER SECTION
  ========================= */

  .order-section {
    background:
      radial-gradient(
        circle at top,
        #310000 0%,
        #130607 35%,
        #080808 75%
      );
  }

  .order-container {
    max-width: 850px;

    margin: auto;

    background: #111111;

    padding: 35px;

    border-radius: 24px;

    border: 1px solid var(--border);

    box-shadow:
      0 15px 40px rgba(0, 0, 0, .55);
  }

  form {
    display: grid;
    gap: 18px;
  }

  label {
    display: block;

    margin-bottom: 6px;

    color: #eee1e3;

    font-size: 14px;

    font-weight: 600;
  }

  input,
  select,
  textarea {
    width: 100%;

    padding: 13px;

    background: #090909;

    color: white;

    border: 1px solid #452025;

    border-radius: 11px;

    outline: none;

    font-family: "Poppins", sans-serif;

    font-size: 14px;

    transition: .2s;
  }

  input::placeholder,
  textarea::placeholder {
    color: #76696b;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--red);

    box-shadow:
      0 0 0 2px rgba(143, 16, 36, .12);
  }

  select option {
    background: #111;
    color: white;
  }

  textarea {
    min-height: 115px;
    resize: vertical;
  }

  .two-columns {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
  }

  .checkbox-group {
    display: grid;
    gap: 9px;
  }

  .check {
    display: flex;

    gap: 9px;

    align-items: center;

    font-weight: 400;

    margin: 0;
  }

  .check input {
    width: auto;

    accent-color: var(--red);
  }

  /* =========================
     DEPOSIT
  ========================= */

  .deposit-box {
    background: #21070b;

    padding: 18px;

    border-radius: 14px;

    border: 1px solid #51141e;

    color: #d8c5c8;

    font-size: 13px;
  }

  .deposit-box strong {
    color: #d21f3c;
  }

  /* =========================
     TOTAL
  ========================= */

  .total-box {
    background:
      linear-gradient(
        135deg,
        #350006,
        #0a0a0a
      );

    color: white;

    padding: 21px;

    border-radius: 16px;

    text-align: center;

    border: 1px solid #5c111c;
  }

  .total-box h3 {
    font-family: "DM Serif Display", serif;

    font-size: 22px;

    font-weight: 400;
  }

  #total {
    color: #d21f3c;

    font-size: 36px;

    font-weight: 800;
  }

  #deposit {
    color: #d8aeb5;
  }

  /* =========================
     RECEIPT
  ========================= */

  #receipt {
    display: none;

    max-width: 850px;

    margin: 35px auto 0;

    background: #111111;

    border: 1px dashed #8f1024;

    border-radius: 20px;

    padding: 28px;

    box-shadow:
      0 10px 30px rgba(0, 0, 0, .4);
  }

  .receipt-header {
    text-align: center;

    border-bottom: 1px solid #39151a;

    padding-bottom: 15px;

    margin-bottom: 15px;
  }

  .receipt-header h2 {
    font-family: "Great Vibes", cursive;

    font-size: 43px;

    font-weight: 400;

    color: var(--bright-red);
  }

  .receipt-header p {
    color: var(--gray);
    font-size: 13px;
  }

  .receipt-row {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    padding: 8px 0;

    border-bottom:
      1px solid #241417;

    font-size: 13px;
  }

  .receipt-row strong {
    color: #d21f3c;

    text-align: right;
  }

  .receipt-total {
    margin-top: 15px;

    font-size: 18px;

    font-weight: 800;

    color: white;
  }

  .receipt-total span {
    color: #d21f3c;
  }

  .receipt-actions {
    display: flex;

    gap: 10px;

    justify-content: center;

    flex-wrap: wrap;

    margin-top: 22px;
  }

  /* =========================
     CONTACT
  ========================= */

  .socials {
    text-align: center;
  }

  .social-buttons {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-top: 20px;
  }

  .socials p {
    color: var(--gray);
    font-size: 14px;
  }

  .socials strong {
    color: #d21f3c;
  }

  /* =========================
     FOOT
